[package]
name = "erm-editor"
version = "1.0.0"
description = "ERM-Editor — Chen-Notation Entity-Relationship-Diagramm Editor"
authors = ["Best-Tools"]
edition = "2021"

[lib]
name = "erm_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
